<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود به حساب</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap.icons.css">
    <link rel="stylesheet" href="assets/css/panel.style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-card-header">
            <div class="brand-mark"><i class="bi bi-buildings"></i></div>
            <h1>ورود به پنل</h1>
            <p>بنگاه املاک — مدیریت مشتری و ملک</p>
        </div>
        <div class="auth-card-body">
            <form action="dashboard.html" method="get" novalidate>
                <div class="mb-3">
                    <label class="form-label required" for="login_username">نام کاربری</label>
                    <input type="text" class="form-control" id="login_username" name="username"
                           placeholder="نام کاربری خود را وارد کنید" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label required" for="login_password">رمز عبور</label>
                    <div class="input-with-icon">
                        <input type="password" class="form-control" id="login_password" name="password"
                               placeholder="رمز عبور" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-toggle-password="#login_password" aria-label="نمایش رمز">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="remember_me" name="remember">
                        <label class="form-check-label" for="remember_me">مرا به خاطر بسپار</label>
                    </div>
                    <a href="#" class="small" style="color:var(--panel-primary);font-weight:700">فراموشی رمز؟</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-left ms-1"></i>
                    ورود به حساب
                </button>
            </form>
            <div class="auth-footer">
                حساب کاربری ندارید؟
                <a href="register.html">ثبت‌نام کنید</a>
            </div>
        </div>
    </div>
</div>
<script>
document.querySelectorAll("[data-toggle-password]").forEach(btn => {
    btn.addEventListener("click", () => {
        const input = document.querySelector(btn.dataset.togglePassword);
        if (!input) return;
        const isPass = input.type === "password";
        input.type = isPass ? "text" : "password";
        btn.querySelector("i").className = isPass ? "bi bi-eye-slash" : "bi bi-eye";
    });
});
</script>
</body>
</html>
