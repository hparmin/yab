<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ثبت‌نام</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap.icons.css">
    <link rel="stylesheet" href="assets/css/panel.style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card auth-card-wide">
        <div class="auth-card-header">
            <div class="brand-mark"><i class="bi bi-person-plus"></i></div>
            <h1>ثبت‌نام در پنل</h1>
            <p>اطلاعات شخصی و حساب کاربری خود را کامل وارد کنید</p>
        </div>
        <div class="auth-card-body">
            <form action="login.html" method="get" novalidate>
                <!-- اطلاعات هویتی -->
                <div class="form-section light-gray-form-section mb-3">
                    <div class="form-section-title"><i class="bi bi-person-vcard"></i> اطلاعات هویتی</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label required" for="first_name">نام</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="مثلاً نازنین" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="last_name">نام خانوادگی</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="مثلاً یحیی‌پور" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="father_name">نام پدر</label>
                            <input type="text" class="form-control" id="father_name" name="father_name" placeholder="نام پدر" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="national_id">کد ملی</label>
                            <input type="text" class="form-control" id="national_id" name="national_id"
                                   placeholder="۱۰ رقم بدون خط تیره" maxlength="10" inputmode="numeric" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="birth_date">تاریخ تولد</label>
                            <input type="text" class="form-control" id="birth_date" name="birth_date"
                                   placeholder="مثلاً ۱۳۷۰/۰۵/۱۲" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="gender">جنسیت</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="">انتخاب کنید</option>
                                <option value="female">زن</option>
                                <option value="male">مرد</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- اطلاعات تماس -->
                <div class="form-section light-gray-form-section mb-3">
                    <div class="form-section-title"><i class="bi bi-telephone"></i> اطلاعات تماس و آدرس</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label required" for="mobile">شماره موبایل</label>
                            <input type="tel" class="form-control" id="mobile" name="mobile"
                                   placeholder="۰۹۱۲xxxxxxx" maxlength="11" inputmode="numeric" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phone">تلفن ثابت</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="اختیاری">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">ایمیل</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="postal_code">کد پستی</label>
                            <input type="text" class="form-control" id="postal_code" name="postal_code"
                                   placeholder="۱۰ رقم" maxlength="10" inputmode="numeric" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="province">استان</label>
                            <input type="text" class="form-control" id="province" name="province" placeholder="مثلاً فارس" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="city">شهر</label>
                            <input type="text" class="form-control" id="city" name="city" placeholder="مثلاً شیراز" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="district">محله / منطقه</label>
                            <input type="text" class="form-control" id="district" name="district" placeholder="اختیاری">
                        </div>
                        <div class="col-12">
                            <label class="form-label required" for="address">آدرس کامل</label>
                            <textarea class="form-control" id="address" name="address" rows="2"
                                      placeholder="خیابان، کوچه، پلاک، واحد" required></textarea>
                        </div>
                    </div>
                </div>

                <!-- حساب کاربری -->
                <div class="form-section light-gray-form-section mb-3">
                    <div class="form-section-title"><i class="bi bi-shield-lock"></i> اطلاعات ورود</div>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label required" for="username">نام کاربری (یکتا)</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="فقط حروف انگلیسی، عدد و _" autocomplete="username" required>
                            <div class="form-text">نام کاربری باید یکتا باشد و بعداً قابل تغییر نیست.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="password">رمز عبور</label>
                            <div class="input-with-icon">
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="حداقل ۸ کاراکتر" autocomplete="new-password" required>
                                <button type="button" class="password-toggle" data-toggle-password="#password" aria-label="نمایش رمز">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="password_confirmation">تکرار رمز عبور</label>
                            <div class="input-with-icon">
                                <input type="password" class="form-control" id="password_confirmation" name="password_confirmation"
                                       placeholder="تکرار رمز عبور" autocomplete="new-password" required>
                                <button type="button" class="password-toggle" data-toggle-password="#password_confirmation" aria-label="نمایش رمز">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                    <label class="form-check-label" for="terms">
                        <span class="required">قوانین و مقررات</span> پنل را مطالعه کرده و می‌پذیرم.
                    </label>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2">
                    <button type="submit" class="btn btn-primary px-5 py-2 flex-grow-1">
                        <i class="bi bi-check2-circle ms-1"></i>
                        ایجاد حساب کاربری
                    </button>
                    <a href="login.html" class="btn btn-light-panel px-4 py-2">انصراف</a>
                </div>
            </form>
            <div class="auth-footer">
                قبلاً ثبت‌نام کرده‌اید؟
                <a href="login.html">وارد شوید</a>
            </div>
        </div>
    </div>
</div>
<script>
document.querySelectorAll("[data-toggle-password]").forEach(btn => {
    btn.addEventListener("click", () => {
        const input = document.querySelector(btn.dataset.togglePassword);
        if (!input) return;
        const isPass = input.type === "password";
        input.type = isPass ? "text" : "password";
        btn.querySelector("i").className = isPass ? "bi bi-eye-slash" : "bi bi-eye";
    });
});
</script>
</body>
</html>
